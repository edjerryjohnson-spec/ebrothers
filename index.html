<style>
/* Layout: one narrow column like a phone card; each QR opens one view (#hash), no hash shows everything. */
:root{
  --bg:#F3EEE4; --surface:#FBF8F2; --line:#E2DACB; --ink:#1E2A26; --muted:#5A635F;
  --accent:#2E7D5B; --accent-ink:#236347; --on-accent:#FBF8F2;
  --font:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17201D; --surface:#1F2A26; --line:#33423C; --ink:#EDE7DA; --muted:#A9B3AE;
  --accent:#3E9A72; --accent-ink:#8CCBA9; --on-accent:#0F1714; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17201D; --surface:#1F2A26; --line:#33423C; --ink:#EDE7DA; --muted:#A9B3AE;
  --accent:#3E9A72; --accent-ink:#8CCBA9; --on-accent:#0F1714; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
.brand{display:flex;flex-direction:column;align-items:center;gap:6px;padding:20px 16px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.brand img{width:min(260px,70%);height:auto}
:root[data-theme="dark"] .brand img{filter:invert(.92) hue-rotate(180deg)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .brand img{filter:invert(.92) hue-rotate(180deg)}}
h1{font-size:22px;line-height:1.25;margin:0;text-wrap:balance}
h2{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-ink);margin:0}
.muted{color:var(--muted)}
.contact{display:flex;flex-direction:column;gap:10px}
.who{font-size:20px;font-weight:700;margin:0}
.role{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-ink);font-weight:600}
.line{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.line .cc{font-size:11px;font-weight:700;color:var(--muted);width:22px;letter-spacing:.06em}
.line .val{flex:1;min-width:0;overflow-wrap:anywhere;user-select:all;font-variant-numeric:tabular-nums}
.line a{color:var(--ink);text-decoration:none}
button{font:inherit;cursor:pointer;border-radius:8px}
.copy{border:1px solid var(--line);background:transparent;color:var(--accent-ink);font-size:12px;font-weight:600;padding:5px 10px}
.copy:focus-visible,.dl:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.docs{display:grid;gap:12px}
.doc{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.doc img{width:78px;height:auto;border-radius:4px;border:1px solid var(--line);flex:none}
.doc .meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.doc .t{font-weight:700;font-size:15px}
.doc .d{font-size:13px;color:var(--muted)}
.doc.single{flex-direction:column;align-items:stretch;padding:16px}
.doc.single img{width:100%;max-width:100%}
.dl{display:inline-block;text-decoration:none;align-self:flex-start;background:var(--accent);color:var(--on-accent);border:0;font-weight:700;padding:10px 16px}
.dl[disabled]{opacity:.6;cursor:default}
.status{font-size:13px;color:var(--muted);min-height:1.2em}
.foot{font-size:12px;color:var(--muted);text-align:center}
.foot a{color:var(--accent-ink)}
</style>

const thumb = f => THUMBS[f];

function card(doc, single, lang){
  const lg = lang || doc.lang;
  const tt = (lang === "fr" && doc.tfr) ? doc.tfr : (lang === "en" && doc.ten) ? doc.ten : doc.t;
  const el = document.createElement("div");
  el.className = "doc" + (single ? " single" : "");
  const img = document.createElement("img");
  img.src = thumb(doc.file); img.alt = tt; img.loading = "lazy";
  const meta = document.createElement("div"); meta.className = "meta";
  const t = document.createElement("div"); t.className = "t"; t.textContent = tt;
  const d = document.createElement("div"); d.className = "d"; d.textContent = doc.d;
  const b = document.createElement("a"); b.className = "dl"; b.id = "dl-" + doc.id; 
  const s = document.createElement("div"); s.className = "status";
  b.textContent = L[lg].dl;
  b.href = doc.file; b.setAttribute("download", doc.file);
  meta.append(t, d, b, s);
  el.append(img, meta);
  return el;
}

const UI = {en:{copy:"Copy", copied:"Copied", sel:"Selected", head:"Documents", foot:"Mining · Industry · Construction — West Africa"},
            fr:{copy:"Copier", copied:"Copié", sel:"Sélectionné", head:"Documents", foot:"Mines · Industrie · Construction — Afrique de l’Ouest"}};
let ui = UI.en;
function setLang(lg){
  ui = UI[lg]; document.documentElement.lang = lg;
  document.querySelectorAll(".copy").forEach(b => b.textContent = ui.copy);
  document.getElementById("docs-h").textContent = ui.head;
  document.getElementById("addr").textContent = "E-BROTHERS SARL · Carrières-sous-Poissy, France · " + (lg === "fr" ? "Chine · États-Unis" : "China · USA");
  document.getElementById("foot").innerHTML = ui.foot + "<br>Sourcing · Logistics · Crushing";
}

function render(){
  const h = (location.hash || "").replace("#", "");
  const box = document.getElementById("docs");
  box.textContent = "";
  const one = DOCS.find(x => x.id === h);
  const contact = document.getElementById("v-contact");
  const heading = document.getElementById("docs-h");
  if (one) {
    setLang(one.lang);
    contact.hidden = one.id !== "carte";
    heading.hidden = true;
    box.append(card(one, true));
  } else if (h === "en" || h === "fr") {
    setLang(h);
    contact.hidden = false; heading.hidden = false;
    DOCS.filter(x => x.id === "carte" || x.lang === h).forEach(x => box.append(card(x, false, h)));
  } else {
    setLang("en");
    contact.hidden = false; heading.hidden = false;
    DOCS.forEach(x => box.append(card(x, false)));
  }
}

document.querySelectorAll(".copy").forEach(btn => btn.addEventListener("click", async () => {
  const v = btn.dataset.copy;
  try { await navigator.clipboard.writeText(v); btn.textContent = ui.copied; }
  catch { const r = document.createRange(); r.selectNodeContents(btn.previousElementSibling); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); btn.textContent = ui.sel; }
  setTimeout(() => btn.textContent = ui.copy, 1600);
}));

window.addEventListener("hashchange", render);
render();
</script>
